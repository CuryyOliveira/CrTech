name: V2.1 · Conferência no WebView do Android (emuladores, sem publicar)

# Só a branch da V2. APK de DEBUG gerado na hora (nunca publicado), app web REAL compilado com
# VITE_CONFERENCE_V2=1 e Supabase LOCAL (Docker, migrations do repositório). Nada de produção.
on:
  push:
    branches: [v2-development]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "tests/homologacao/**"
      - "mobile/**"
      - ".github/workflows/v21-android-webview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v21-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webview:
    name: WebView API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 30
            target: default
          - api: 34
            target: google_apis
    env:
      HOMOLOG_DIR: ${{ github.workspace }}/.homologacao
      SUPABASE_BIN: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dependências
        run: npm ci

      - name: Supabase local (migrations do repositório)
        run: |
          bash tests/homologacao/preparar.sh supabase
          bash tests/homologacao/preparar.sh env | sed 's/^export //' >> "$GITHUB_ENV"

      - name: App real (V2.1 ligada) apontando para o Supabase local
        run: bash tests/homologacao/preparar.sh app 1 3101

      - name: APK de debug (URL de teste só em debug)
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon -q assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/app-debug.apk"

      - name: APK de release continua só com a URL de produção (sem debug, sem http)
        if: matrix.api == 34
        working-directory: mobile/android
        env:
          ANDROID_RELEASE_SEM_ASSINATURA: "true"
        run: |
          ./gradlew --no-daemon -q assembleRelease
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          MANIFESTO="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")"
          echo "$MANIFESTO" | grep -E "debuggable|usesCleartextTraffic" || true
          if echo "$MANIFESTO" | grep -E "android:debuggable.*=(true|0xffffffff)"; then echo "::error::release debuggable"; exit 1; fi
          echo "$MANIFESTO" | grep -E "usesCleartextTraffic.*=(false|0x0)" >/dev/null || { echo "::error::release permite http"; exit 1; }
          grep -q "https://conferenciarapida.com.br/" app/src/main/java/br/com/conferenciarapida/app/MainActivity.java
          echo "Release: sem debuggable, cleartext desligado; URL de teste só é aceita em build debuggable."

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Conferência no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb reverse tcp:3101 tcp:3101
            adb reverse tcp:54321 tcp:54321
            adb install -r "$RUNNER_TEMP/app-debug.apk"
            npx vite-node tests/homologacao/android.ts android-resultados-${{ matrix.api }}

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-webview-api-${{ matrix.api }}
          path: |
            android-resultados-${{ matrix.api }}
            .homologacao/app-v1.log
          if-no-files-found: ignore
