name: V2.1 · Conferência no WebView do Android (emuladores, sem publicar)

# Só a branch da V2. Usa um APK de DEBUG gerado na hora (nunca publicado) e um Postgres de TESTE.
on:
  push:
    branches: [v2-development]
    paths:
      - "src/components/conferencia-v2/**"
      - "src/lib/conferencia-v2/**"
      - "src/lib/sync-v2/**"
      - "tests/e2e/**"
      - "mobile/**"
      - ".github/workflows/v21-android-webview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v21-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webview:
    name: WebView API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Android 8 de fábrica traz um WebView de 2017 (sem atualização pela Play Store no emulador):
    # o resultado é registrado, mas não bloqueia.
    continue-on-error: ${{ matrix.api == 26 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 30
            target: default
          - api: 34
            target: google_apis
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: supabase_admin
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supabase_admin" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgresql://supabase_admin:supabase_admin@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: gradle/actions/setup-gradle@v4

      - name: Dependências
        run: npm ci

      - name: Servidor de teste + página da conferência
        run: |
          npx vite build --config tests/e2e/vite.harness.config.ts
          nohup npx vite-node tests/e2e/servidor.ts > servidor.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:4173/ >/dev/null

      - name: APK de debug (URL de teste só em debug)
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon -q assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/app-debug.apk"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Conferência no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb reverse tcp:4173 tcp:4173
            adb install -r "$RUNNER_TEMP/app-debug.apk"
            node tests/e2e/android/webview.mjs android-resultados-${{ matrix.api }}

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-webview-api-${{ matrix.api }}
          path: |
            android-resultados-${{ matrix.api }}
            servidor.log
          if-no-files-found: ignore
