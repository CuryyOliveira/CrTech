name: APK Android

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CR_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar Capacitor
        run: npm ci

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Build (debug + release), testes e lint
        working-directory: mobile/android
        env:
          # Com a rotação aprovada, o release sai sem assinatura e é assinado no passo seguinte.
          ANDROID_RELEASE_SEM_ASSINATURA: ${{ vars.ANDROID_ROTACAO_APROVADA == 'true' && secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Assinar o release com rotação de chave (somente com aprovação explícita)
        if: ${{ vars.ANDROID_ROTACAO_APROVADA == 'true' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] || { echo "::error::ANDROID_ROTACAO_APROVADA=true, mas o secret ANDROID_KEYSTORE_BASE64 não existe"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/producao.keystore"
          export CHAVE_NOVA_KS="$RUNNER_TEMP/producao.keystore"
          D=mobile/android/app/build/outputs/apk/release
          UNS="$(ls "$D"/*.apk)"
          mv "$UNS" "$RUNNER_TEMP/sem-assinatura.apk"
          bash scripts/android/assinar-com-rotacao.sh "$RUNNER_TEMP/sem-assinatura.apk" "$UNS"
          SHA="$(keytool -list -v -keystore "$CHAVE_NOVA_KS" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | head -1)"
          echo "SHA256_NOVA=$SHA" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/producao.keystore" "$RUNNER_TEMP/sem-assinatura.apk"

      - name: Verificar APKs (bloqueia a publicação de APK que não atualizaria o app instalado)
        working-directory: mobile/android/app/build/outputs/apk
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in debug/*.apk release/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            "$BT/apksigner" verify --print-certs "$apk" | head -6
            "$BT/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label)" || true
          done
          bash "$GITHUB_WORKSPACE/scripts/android/verificar-apk.sh" release/*.apk "$CR_VERSION_CODE"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp debug/*.apk release/*.apk "$GITHUB_WORKSPACE/apk/"
          (cd "$GITHUB_WORKSPACE/apk" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: conferencia-rapida-apk
          path: apk/
          if-no-files-found: error

      - name: Publicar na página de Releases
        working-directory: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_REF_NAME//\//-}"
          NOTAS="APK Android do Conferência Rápida (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Instale o arquivo *-release.apk no celular."
          # Recria a release para apontar sempre para o commit mais recente.
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" *.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
            --title "Conferência Rápida – Android ($GITHUB_REF_NAME)" --notes "$NOTAS" --repo "$GITHUB_REPOSITORY"
